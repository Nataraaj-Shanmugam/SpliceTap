<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpliceTap Panel</title>
    <!-- Styles live inline because the panel has no external stylesheet and the
         extension-page CSP forbids inline *scripts*, not inline styles.
         Selector contract with panel.js is unchanged: #totalRequests,
         #mockedRequests, #activeRules, #successRate, #errorContainer,
         #logAnnouncer, #requestsList, #requestTable, #requestItems,
         #emptyState, #pauseBtn, #exportHarBtn, #clearRequestsBtn, #filterText, #filterType,
         .request-item(.request-item-header), .col-header, .request-method +
         .method-*, .request-url/.url-toggle, .rule-info/.rule-name,
         .rule-type-badge[data-type], .request-status + .status-*, .timestamp,
         .request-actions/.dismiss-btn, .empty-state/.empty-icon/.empty-title/
         .empty-description, .error-state, .visually-hidden,
         body.theme-light / body.theme-dark. -->
    <style>
        /* ── Tokens — identical set to popup/popup.css ─────────────────── */
        :root {
            --bg-app: #0b1018;
            --bg-elevated: #0d141e;
            --bg-card: #111a27;
            --bg-card-hover: #101a27;
            --bg-chip: #1b2735;
            --text-main: #e7eefb;
            --text-muted: #8b9ab3;
            --text-dim: #8391a8;
            /* Accent roles are split by contrast requirement:
                 --accent        fills that carry white text (5.05:1 with #fff)
                 --accent-bright non-text only — focus rings, borders,
                                 decorative icons (3:1 bar). Never a fill
                                 behind text: #fff on #2f7dfa is only 3.86:1. */
            --accent: #1e63f5;
            --accent-hover: #1d4fd7;
            --accent-bright: #2f7dfa;
            --brand-gradient: linear-gradient(135deg, #1e63f5, #0bbcd4);
            --accent-gradient: linear-gradient(135deg, #1e63f5, #0e7490);
            --accent-gradient-hover: linear-gradient(135deg, #1d4fd7, #0c6179);

            --signal: #0bbcd4;
            --signal-text: #5fdcf0;
            --success: #22c55e;
            --danger: #ef4444;
            --border: rgba(148, 163, 184, 0.12);
            --hairline: rgba(148, 163, 184, 0.09);
            --border-strong: rgba(148, 163, 184, 0.6);
            --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.3);
            --shadow-md: 0 6px 20px rgba(0, 0, 0, 0.4);
            --font-main: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            --font-mono: ui-monospace, 'SF Mono', 'Cascadia Code', Consolas, 'Liberation Mono', Menlo, monospace;
            --ease: cubic-bezier(0.4, 0, 0.2, 1);
            color-scheme: dark;
        }

        /* Light theme — applied by panel.js from the settings carried on the
           existing `getRules` response (U-9); 'auto' resolves via
           prefers-color-scheme, same as popup.js/options.js. */
        body.theme-light {
            --bg-app: #ffffff;
            --bg-elevated: #fafbfd;
            --bg-card: #f4f6fa;
            --bg-card-hover: #f5f9ff;
            --bg-chip: #eef2f7;
            --text-main: #101828;
            --text-muted: #5d6a80;
            --text-dim: #667383;
            --accent: #1e63f5;
            --accent-hover: #1d4fd7;
            --accent-bright: #2f7dfa;
            --signal: #0694aa;
            --signal-text: #03707f;
            --success: #15803d;
            --danger: #dc2626;
            --border: #e6ebf2;
            --hairline: #eef1f6;
            --border-strong: rgba(15, 23, 42, 0.5);
            --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.08);
            --shadow-md: 0 6px 20px rgba(15, 23, 42, 0.14);
            color-scheme: light;
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-main);
            margin: 0;
            padding: 16px;
            background: var(--bg-app);
            color: var(--text-main);
            font-size: 12.5px;
        }

        /* Brand hairline along the top edge — same motif as the popup,
           options page and in-page overlay. Decorative only; `fixed` so it
           takes no layout space and overlays the body's 16px top padding. */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            z-index: 30;
            background: var(--brand-gradient);
        }

        /* ── Utilities ────────────────────────────────────────────────── */
        .visually-hidden {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }

        /* ── Header ───────────────────────────────────────────────────── */
        .panel-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border);
        }

        /* Holds the brand mark. `background` is only a fallback behind the
           SVG (which covers it fully); the "TM" text styling likewise only
           applies if the mark is ever removed. */
        .panel-logo {
            width: 26px;
            height: 26px;
            flex-shrink: 0;
            border-radius: 7px;
            overflow: hidden;
            background: var(--accent);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 11px;
            letter-spacing: -0.01em;
        }

        .panel-logo svg {
            width: 100%;
            height: 100%;
            display: block;
        }

        .panel-title {
            font-size: 14px;
            font-weight: 600;
            letter-spacing: -0.01em;
            line-height: 1.15;
            margin: 0;
        }

        /* ── Stat cards ───────────────────────────────────────────────── */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 10px;
            margin-bottom: 16px;
        }

        .stat-card {
            background: var(--bg-card);
            padding: 12px 14px;
            border-radius: 9px;
            border: 1px solid var(--border);
        }

        .stat-value {
            font-size: 20px;
            font-weight: 700;
            line-height: 1.2;
            letter-spacing: -0.02em;
            color: var(--text-main);
            margin-bottom: 4px;
        }

        /* Micro-label: 10px/600 uppercase. --text-muted rather than
           --text-dim so 10px copy still clears 4.5:1 on --bg-card. */
        .stat-label {
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--text-muted);
            margin: 0;
        }

        /* ── Log section shell ────────────────────────────────────────── */
        .requests-section {
            background: var(--bg-app);
            border: 1px solid var(--border);
            border-radius: 9px;
            overflow: hidden;
        }

        .section-header {
            padding: 9px 14px;
            background: var(--bg-elevated);
            border-bottom: 1px solid var(--border);
            font-weight: 600;
            font-size: 12.5px;
            letter-spacing: -0.01em;
            display: flex;
            justify-content: space-between;
            align-items: center;
            /* F5: three actions no longer fit beside the heading in a narrow
               DevTools dock, so the row wraps instead of squeezing a label. */
            flex-wrap: wrap;
            gap: 8px 12px;
        }

        .section-header h2 {
            margin: 0;
            font: inherit;
            letter-spacing: inherit;
        }

        .section-header-actions {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* ── Pause / Export / Clear ───────────────────────────────────── */
        .pause-btn,
        .export-btn,
        .clear-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            min-height: 26px;
            padding: 4px 10px;
            border-radius: 6px;
            font-family: var(--font-main);
            font-size: 11px;
            font-weight: 600;
            white-space: nowrap;
            cursor: pointer;
            transition: background-color 0.15s var(--ease), border-color 0.15s var(--ease), color 0.15s var(--ease);
        }

        .pause-btn {
            background: rgba(148, 163, 184, 0.10);
            color: var(--text-main);
            border: 1px solid var(--border);
        }

        .pause-btn:hover {
            background: rgba(148, 163, 184, 0.18);
        }

        /* Live-polling dot. CSS-generated, so panel.js's
           `btn.textContent = 'Pause'/'Resume'` never clobbers it. */
        .pause-btn::before {
            content: '';
            width: 6px;
            height: 6px;
            flex-shrink: 0;
            border-radius: 50%;
            background: var(--text-dim);
            transition: background-color 0.3s, box-shadow 0.3s;
        }

        /* aria-pressed="false" == not paused == the log is live. Cyan
           --signal is the system's "active" colour, not green. */
        .pause-btn[aria-pressed="false"] {
            color: var(--signal-text);
            background: rgba(11, 188, 212, 0.10);
            border-color: rgba(11, 188, 212, 0.28);
        }

        .pause-btn[aria-pressed="false"]:hover {
            background: rgba(11, 188, 212, 0.18);
        }

        .pause-btn[aria-pressed="false"]::before {
            background: var(--signal);
            box-shadow: 0 0 0 3px rgba(11, 188, 212, 0.18);
        }

        /* PER-80: the label stays "Pause" and aria-pressed carries the state
           (the old "Resume" + pressed read as "Resume, pressed"); paused is
           shown as a filled, pressed-in button instead of different words. */
        .pause-btn[aria-pressed="true"] {
            background: rgba(148, 163, 184, 0.28);
            border-color: var(--text-muted);
        }

        /* F5: a plain action — neutral like Pause, but without its live dot. */
        .export-btn {
            background: rgba(148, 163, 184, 0.10);
            color: var(--text-main);
            border: 1px solid var(--border);
        }

        .export-btn:hover {
            background: rgba(148, 163, 184, 0.18);
        }

        .clear-btn {
            background: rgba(239, 68, 68, 0.10);
            color: #fca5a5;
            border: 1px solid rgba(239, 68, 68, 0.26);
        }

        .clear-btn:hover {
            background: rgba(239, 68, 68, 0.18);
        }

        /* ── Filter bar ───────────────────────────────────────────────── */
        .filter-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 14px;
            background: var(--bg-elevated);
            border-bottom: 1px solid var(--border);
        }

        .filter-input,
        .filter-select {
            height: 32px;
            background: var(--bg-card);
            color: var(--text-main);
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 12.5px;
            font-family: var(--font-main);
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .filter-input {
            flex: 1;
            min-width: 0;
            padding: 0 10px;
        }

        .filter-input::placeholder {
            color: var(--text-dim);
            opacity: 1;
        }

        .filter-select {
            padding: 0 8px;
            cursor: pointer;
        }

        .filter-input:focus,
        .filter-select:focus {
            outline: none;
            border-color: var(--accent-bright);
            box-shadow: 0 0 0 3px rgba(47, 125, 250, 0.18);
        }

        /* ── Log list ─────────────────────────────────────────────────── */
        .requests-list {
            max-height: 460px;
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: rgba(148, 163, 184, 0.3) transparent;
        }

        .requests-list::-webkit-scrollbar {
            width: 4px;
        }

        .requests-list::-webkit-scrollbar-thumb {
            background: rgba(148, 163, 184, 0.3);
            border-radius: 4px;
        }

        /* Dense hairline rows, mirroring the popup's rule list. */
        /* A grid of fixed columns (it was a flex line with fixed-width cells,
           which is the same thing until a cell is wider than its pill: a long
           outcome pushed the rule column out of line with the rows around it).
           method | url | rule | status | time | dismiss */
        .request-item {
            padding: 8px 14px;
            border-bottom: 1px solid var(--hairline);
            display: grid;
            grid-template-columns: 60px minmax(0, 1fr) 140px 64px 56px 24px;
            align-items: center;
            column-gap: 10px;
            row-gap: 4px;
            transition: background-color 0.15s var(--ease);
        }

        .request-item:hover {
            background: var(--bg-card-hover);
        }

        .request-item:last-child {
            border-bottom: none;
        }

        .request-item-header {
            position: sticky;
            top: 0;
            z-index: 1;
            background: var(--bg-elevated);
            padding-top: 7px;
            padding-bottom: 7px;
            border-bottom: 1px solid var(--border);
        }

        .request-item-header:hover {
            background: var(--bg-elevated);
        }

        .col-header {
            background: transparent !important;
            color: var(--text-muted) !important;
            font-family: var(--font-main) !important;
            font-weight: 600;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        .request-method {
            min-width: 60px;
            padding: 2px 6px;
            border-radius: 4px;
            font-family: var(--font-mono);
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            text-align: center;
            flex-shrink: 0;
            background: rgba(148, 163, 184, 0.14);
            color: var(--text-muted);
        }

        .method-get { background: rgba(56, 189, 248, 0.14); color: #7dd3fc; }
        .method-post { background: rgba(34, 197, 94, 0.14); color: #6ee7a0; }
        .method-put { background: rgba(251, 146, 60, 0.16); color: #fdba74; }
        .method-delete { background: rgba(244, 63, 94, 0.16); color: #fb7185; }

        .request-url {
            font-family: var(--font-mono);
            font-size: 12px;
            line-height: 1.4;
            flex: 1;
            min-width: 0;
            color: var(--text-main);
        }

        .url-toggle {
            background: none;
            border: none;
            padding: 0;
            margin: 0;
            color: inherit;
            font: inherit;
            text-align: left;
            cursor: pointer;
            width: 100%;
            word-break: break-all;
            border-radius: 4px;
        }

        .url-toggle:hover,
        .url-toggle:focus-visible {
            text-decoration: underline;
        }

        .request-status {
            min-width: 62px;
            padding: 2px 6px;
            border-radius: 4px;
            font-family: var(--font-mono);
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            text-align: center;
            flex-shrink: 0;
        }

        .status-success { background: rgba(34, 197, 94, 0.14); color: #6ee7a0; }
        .status-error { background: rgba(239, 68, 68, 0.16); color: #fca5a5; }
        .status-pending { background: rgba(148, 163, 184, 0.14); color: #a8b6c9; }
        /* PER-56: a redirect that worked is not an error. Same quiet hue as
           "pending", but its own class so the two can drift apart. */
        .status-neutral { background: rgba(148, 163, 184, 0.14); color: #a8b6c9; }

        /* PER-54 / PER-56: the longer outcomes ("→ 200 via https://dest/",
           "200 after 1500 ms", "failed (chaos)") do not fit the status column.
           They wrap, keep their case (a URL is not upper-case), sit left-aligned
           and take a second line under the URL and rule columns, so every
           column on the first line stays in line with the rows around it. */
        .request-status.status-detail {
            justify-self: start;
            max-width: 100%;
            text-align: left;
            text-transform: none;
            letter-spacing: 0.02em;
            line-height: 1.4;
            white-space: normal;
            overflow-wrap: anywhere;
        }

        /* PER-57: a row with actions under its URL is taller than its other
           cells, so they line up with the URL's first line instead of floating
           to the middle of the taller cell. */
        @media not all and (max-width: 560px) {
            .request-item:has(.row-tools:not([hidden])) {
                align-items: start;
            }
        }

        @media not all and (max-width: 560px) {
            .request-item-detail .request-method { grid-column: 1; grid-row: 1; }
            .request-item-detail .request-url { grid-column: 2; grid-row: 1; }
            .request-item-detail .rule-info { grid-column: 3; grid-row: 1; }
            .request-item-detail .request-status { grid-column: 2 / 4; grid-row: 2; }
            .request-item-detail .timestamp { grid-column: 5; grid-row: 1; }
            .request-item-detail .request-actions { grid-column: 6; grid-row: 1; }
        }

        /* PER-54: the note under a request's URL: what the interceptor did
           instead of what the rule says. */
        .request-note {
            margin-top: 3px;
            font-family: var(--font-main);
            font-size: 11px;
            line-height: 1.4;
            color: var(--text-muted);
            overflow-wrap: anywhere;
        }

        /* PER-57: the rule's name is a button that opens it in the editor.
           Styled as the plain name it replaces; only hover and focus say more. */
        .rule-name-btn {
            appearance: none;
            background: none;
            border: 0;
            padding: 0;
            margin: 0;
            font-family: inherit;
            color: var(--text-main);
            text-align: left;
            cursor: pointer;
            border-radius: 3px;
        }

        .rule-name-btn:hover,
        .rule-name-btn:focus-visible {
            text-decoration: underline;
            text-underline-offset: 2px;
        }

        .rule-name-btn:focus-visible,
        .row-tool-btn:focus-visible,
        .response-pre:focus-visible {
            outline: 2px solid var(--accent-bright);
            outline-offset: 2px;
        }

        /* PER-57: View response / Disable rule, under the URL. */
        .row-tools {
            display: flex;
            flex-wrap: wrap;
            align-items: flex-start;
            gap: 4px 6px;
            margin-top: 5px;
            font-family: var(--font-main);
        }

        .row-tools[hidden] {
            display: none;
        }

        .row-tool-btn {
            min-height: 24px;
            padding: 2px 9px;
            border-radius: 6px;
            border: 1px solid var(--border-strong);
            background: transparent;
            color: var(--text-main);
            font-family: inherit;
            font-size: 11px;
            font-weight: 600;
            line-height: 1.3;
            cursor: pointer;
            transition: background-color 0.15s;
        }

        .row-tool-btn:hover {
            background: rgba(148, 163, 184, 0.14);
        }

        .row-tool-btn[aria-busy="true"] {
            opacity: 0.6;
            cursor: progress;
        }

        .response-view {
            flex-basis: 100%;
            min-width: 0;
            padding: 8px 10px;
            border-radius: 6px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            font-family: var(--font-main);
            font-size: 11px;
        }

        .response-view[hidden] {
            display: none;
        }

        .response-status {
            margin: 0 0 6px;
            font-family: var(--font-mono);
            font-weight: 700;
            color: var(--text-main);
        }

        .response-label {
            margin: 6px 0 2px;
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--text-muted);
        }

        .response-pre {
            margin: 0;
            max-height: 180px;
            overflow: auto;
            padding: 6px 8px;
            border-radius: 4px;
            background: var(--bg-app);
            color: var(--text-main);
            font-family: var(--font-mono);
            font-size: 11px;
            line-height: 1.45;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }

        /* Hidden until panel.js's first render decides between the table and
           the empty state, so there is no flash of a bare header row. Gated
           on "has rows" rather than a plain `display: none`: panel.js reveals
           the table with `style.display = ''`, which clears the inline value
           and would otherwise fall straight back to this rule and keep the
           table hidden for good. An inline `display: none` still wins. */
        #requestTable:not(:has(#requestItems > *)) {
            display: none;
        }

        .rule-info {
            display: flex;
            flex-direction: column;
            gap: 2px;
            align-items: flex-start;
            min-width: 140px;
            flex-shrink: 0;
        }

        .rule-name {
            font-size: 12px;
            font-weight: 600;
            line-height: 1.25;
            color: var(--text-main);
            max-width: 100%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .rule-type-badge {
            display: inline-block;
            width: fit-content;
            padding: 1px 5px;
            border-radius: 4px;
            font-size: 9.5px;
            font-weight: 600;
            line-height: 1.35;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            background: rgba(148, 163, 184, 0.14);
            color: var(--text-muted);
        }

        /* Per-type hues, identical to popup/popup.css so a rule type
           reads the same on every surface. */
        .rule-type-badge[data-type="mock"] { background: rgba(47, 125, 250, 0.16); color: #8ab6ff; }
        .rule-type-badge[data-type="block"] { background: rgba(239, 68, 68, 0.16); color: #fca5a5; }
        .rule-type-badge[data-type="delay"] { background: rgba(217, 119, 6, 0.16); color: #fbbf5a; }
        .rule-type-badge[data-type="redirect"] { background: rgba(2, 132, 199, 0.18); color: #7dd3fc; }
        .rule-type-badge[data-type="headers"] { background: rgba(34, 197, 94, 0.16); color: #6ee7a0; }
        .rule-type-badge[data-type="queryparams"] { background: rgba(167, 139, 250, 0.16); color: #c9a2fb; }
        .rule-type-badge[data-type="requestBody"] { background: rgba(244, 114, 182, 0.16); color: #f9a8d4; }
        .rule-type-badge[data-type="chaos"] { background: rgba(217, 70, 239, 0.16); color: #f0abfc; }

        .timestamp {
            font-family: var(--font-mono);
            font-size: 10px;
            letter-spacing: 0.02em;
            color: var(--text-muted);
            flex-shrink: 0;
            min-width: 62px;
            text-align: right;
        }

        .request-actions {
            flex-shrink: 0;
        }

        /* 24x24 keeps the target at the WCAG 2.5.8 minimum. */
        .dismiss-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 15px;
            line-height: 1;
            width: 24px;
            height: 24px;
            padding: 0;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 6px;
            transition: background-color 0.15s, color 0.15s;
        }

        .dismiss-btn:hover,
        .dismiss-btn:focus-visible {
            background: var(--bg-chip);
            color: var(--text-main);
        }

        /* PER-79: a narrow panel (a docked DevTools, or 320 px). The one-line
           row needs ~430 px of fixed-width cells, so below that the URL column
           collapsed to nothing, one character per line. Rows stack instead:
             method  status        time  dismiss
             url (full width, wraps)
             rule + type
           The column-header row cannot line up with stacked rows, so it is
           kept for assistive tech and hidden from view. */
        @media (max-width: 560px) {
            .request-item {
                display: grid;
                grid-template-columns: auto auto 1fr auto;
                grid-template-areas:
                    "method status time actions"
                    "url url url url"
                    "rule rule rule rule";
                column-gap: 8px;
                row-gap: 6px;
                align-items: center;
            }

            .request-method { grid-area: method; }
            .request-status { grid-area: status; }
            .timestamp { grid-area: time; }
            .request-actions { grid-area: actions; }
            .request-url { grid-area: url; }

            /* A wrapping outcome gets a line of its own, full width. */
            .request-item-detail {
                grid-template-columns: auto 1fr auto;
                grid-template-areas:
                    "method time actions"
                    "status status status"
                    "url url url"
                    "rule rule rule";
            }

            .rule-info {
                grid-area: rule;
                flex-direction: row;
                align-items: center;
                flex-wrap: wrap;
                gap: 4px 8px;
                min-width: 0;
            }

            .request-item-header {
                position: absolute;
                width: 1px;
                height: 1px;
                padding: 0;
                margin: -1px;
                overflow: hidden;
                clip: rect(0, 0, 0, 0);
                white-space: nowrap;
                border: 0;
            }

            .rule-name {
                white-space: normal;
                overflow-wrap: anywhere;
            }
        }

        /* ── Empty state ──────────────────────────────────────────────── */
        .empty-state {
            padding: 48px 20px;
            text-align: center;
            color: var(--text-muted);
        }

        /* Decorative icon — a legitimate --accent-bright use (no text on it). */
        .empty-icon {
            width: 40px;
            height: 40px;
            margin: 0 auto 14px;
            color: var(--accent-bright);
            opacity: 0.85;
        }

        .empty-icon svg {
            width: 100%;
            height: 100%;
        }

        .empty-title {
            font-size: 14px;
            font-weight: 600;
            letter-spacing: -0.01em;
            color: var(--text-main);
            margin-bottom: 6px;
        }

        .empty-description {
            font-size: 12.5px;
            line-height: 1.55;
            text-wrap: pretty;
        }

        /* ── Error banner ─────────────────────────────────────────────── */
        .error-state {
            padding: 10px 12px;
            background: rgba(239, 68, 68, 0.10);
            border: 1px solid rgba(239, 68, 68, 0.26);
            border-radius: 8px;
            color: #fca5a5;
            font-size: 12.5px;
            line-height: 1.45;
            margin-bottom: 12px;
        }

        /* ── Focus ────────────────────────────────────────────────────── */
        .pause-btn:focus-visible,
        .export-btn:focus-visible,
        .clear-btn:focus-visible,
        .dismiss-btn:focus-visible,
        .url-toggle:focus-visible,
        .filter-input:focus-visible,
        .filter-select:focus-visible {
            outline: 2px solid var(--accent-bright);
            outline-offset: 2px;
        }

        .url-toggle:focus-visible {
            outline-offset: 1px;
        }

        /* ── Light-theme overrides for hardcoded tints ────────────────── */
        body.theme-light .request-method { background: rgba(15, 23, 42, 0.08); color: #5b6b7f; }
        body.theme-light .method-get { background: rgba(2, 132, 199, 0.12); color: #0369a1; }
        body.theme-light .method-post { background: rgba(21, 128, 61, 0.12); color: #166534; }
        body.theme-light .method-put { background: rgba(217, 119, 6, 0.14); color: #92400e; }
        body.theme-light .method-delete { background: rgba(220, 38, 38, 0.12); color: #b91c1c; }

        body.theme-light .status-success { background: rgba(21, 128, 61, 0.12); color: #166534; }
        body.theme-light .status-error { background: rgba(220, 38, 38, 0.12); color: #b91c1c; }
        body.theme-light .status-pending { background: rgba(15, 23, 42, 0.08); color: #5b6b7f; }
        body.theme-light .status-neutral { background: rgba(15, 23, 42, 0.08); color: #5b6b7f; }

        body.theme-light .rule-type-badge { background: rgba(15, 23, 42, 0.08); color: #5b6b7f; }
        body.theme-light .rule-type-badge[data-type="mock"] { background: rgba(30, 99, 245, 0.12); color: #1d4fd7; }
        body.theme-light .rule-type-badge[data-type="block"] { background: rgba(220, 38, 38, 0.12); color: #b91c1c; }
        body.theme-light .rule-type-badge[data-type="delay"] { background: rgba(217, 119, 6, 0.14); color: #92400e; }
        body.theme-light .rule-type-badge[data-type="redirect"] { background: rgba(2, 132, 199, 0.12); color: #0369a1; }
        body.theme-light .rule-type-badge[data-type="headers"] { background: rgba(21, 128, 61, 0.12); color: #166534; }
        body.theme-light .rule-type-badge[data-type="queryparams"] { background: rgba(124, 58, 237, 0.12); color: #6d28d9; }
        body.theme-light .rule-type-badge[data-type="requestBody"] { background: rgba(190, 24, 93, 0.10); color: #9d174d; }
        body.theme-light .rule-type-badge[data-type="chaos"] { background: rgba(192, 38, 211, 0.12); color: #86198f; }

        body.theme-light .pause-btn,
        body.theme-light .export-btn { background: rgba(15, 23, 42, 0.05); color: var(--text-main); }
        body.theme-light .pause-btn:hover,
        body.theme-light .export-btn:hover { background: rgba(15, 23, 42, 0.09); }
        body.theme-light .pause-btn[aria-pressed="true"] { background: rgba(15, 23, 42, 0.16); border-color: var(--text-muted); }
        body.theme-light .pause-btn[aria-pressed="false"] {
            color: var(--signal-text);
            background: rgba(6, 148, 170, 0.10);
            border-color: rgba(6, 148, 170, 0.32);
        }
        body.theme-light .pause-btn[aria-pressed="false"]:hover { background: rgba(6, 148, 170, 0.18); }
        body.theme-light .pause-btn[aria-pressed="false"]::before { box-shadow: 0 0 0 3px rgba(6, 148, 170, 0.18); }

        body.theme-light .clear-btn { background: rgba(220, 38, 38, 0.08); color: #b91c1c; border-color: rgba(220, 38, 38, 0.22); }
        body.theme-light .clear-btn:hover { background: rgba(220, 38, 38, 0.14); }

        body.theme-light .error-state { background: rgba(220, 38, 38, 0.06); border-color: rgba(220, 38, 38, 0.2); color: #b91c1c; }

        body.theme-light .requests-list { scrollbar-color: rgba(15, 23, 42, 0.22) transparent; }
        body.theme-light .requests-list::-webkit-scrollbar-thumb { background: rgba(15, 23, 42, 0.22); }

        /* ── Motion / forced colours ──────────────────────────────────── */
        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
                scroll-behavior: auto !important;
            }
        }

        @media (forced-colors: active) {
            .stat-card,
            .requests-section,
            .filter-input,
            .filter-select,
            .pause-btn,
            .export-btn,
            .clear-btn,
            .error-state {
                border-color: CanvasText;
            }

            .request-method,
            .request-status,
            .rule-type-badge,
            .row-tool-btn,
            .response-view {
                border: 1px solid CanvasText;
            }

            .request-item {
                border-bottom-color: CanvasText;
            }

            .pause-btn::before {
                background: CanvasText;
            }
        }
    </style>
</head>
<body>
    <header class="panel-header">
        <div class="panel-logo">
            <svg viewBox="0 0 128 128" aria-hidden="true" focusable="false">
                <defs>
                    <linearGradient id="tmLogo" x1="0" y1="0" x2="1" y2="1">
                        <stop offset="0%" stop-color="#1e63f5" />
                        <stop offset="100%" stop-color="#0bbcd4" />
                    </linearGradient>
                </defs>
                <rect x="0" y="0" width="128" height="128" rx="30" fill="url(#tmLogo)" />
                <circle cx="28" cy="44" r="6.5" fill="#fff" opacity="0.5" />
                <circle cx="52" cy="44" r="6.5" fill="#fff" opacity="0.5" />
                <circle cx="76" cy="44" r="6.5" fill="#fff" opacity="0.5" />
                <path d="M88 32 L100 44 L88 56" fill="none" stroke="#fff" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" opacity="0.5" />
                <path d="M100 86 L44 86" fill="none" stroke="#fff" stroke-width="14" stroke-linecap="round" />
                <path d="M42 72 L28 86 L42 100" fill="none" stroke="#fff" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
        </div>
        <h1 class="panel-title">SpliceTap</h1>
    </header>

    <main>
        <div id="errorContainer"></div>

        <!-- Announces new entries / clear actions politely, without forcing
             a screen reader through the whole (possibly 200-row) log on
             every poll tick (A-10). Visually hidden, kept in the DOM. -->
        <div id="logAnnouncer" class="visually-hidden" role="status" aria-live="polite"></div>

        <section class="stats-grid" aria-labelledby="statsHeading">
            <h2 id="statsHeading" class="visually-hidden">Statistics</h2>
            <div class="stat-card">
                <div class="stat-value" id="totalRequests">0</div>
                <div class="stat-label">Logged (this buffer)</div>
            </div>

            <div class="stat-card">
                <div class="stat-value" id="mockedRequests">0</div>
                <!-- PER-53: the background's counter resets daily, so "all time" overstated it -->
                <div class="stat-label">Intercepted today</div>
            </div>

            <div class="stat-card">
                <div class="stat-value" id="activeRules">0</div>
                <div class="stat-label">Active Rules</div>
            </div>

            <div class="stat-card">
                <div class="stat-value" id="successRate">0%</div>
                <div class="stat-label">2xx Responses</div>
            </div>
        </section>

        <section class="requests-section" aria-labelledby="logHeading">
            <div class="section-header">
                <h2 id="logHeading">Intercepted Requests</h2>
                <div class="section-header-actions">
                    <button type="button" class="pause-btn" id="pauseBtn" aria-pressed="false">Pause</button>
                    <!-- F5: downloads the whole log, plus any captured response bodies, as a HAR file -->
                    <button type="button" class="export-btn" id="exportHarBtn" title="Download the log as a HAR file, with captured response bodies">Export HAR</button>
                    <button type="button" class="clear-btn" id="clearRequestsBtn">Clear</button>
                </div>
            </div>

            <div class="filter-bar">
                <input type="text" class="filter-input" id="filterText" placeholder="Filter by URL or rule name…" aria-label="Filter requests by URL or rule name">
                <select class="filter-select" id="filterType" aria-label="Filter by rule type">
                    <option value="all">All types</option>
                    <option value="mock">Mock</option>
                    <option value="block">Block</option>
                    <option value="delay">Delay</option>
                    <option value="redirect">Redirect</option>
                    <option value="headers">Headers</option>
                    <option value="queryparams">Query params</option>
                    <option value="requestBody">Request body</option>
                    <option value="chaos">Chaos</option>
                </select>
            </div>

            <!-- tabindex="-1": panel.js moves focus here when dismissing the last row (PER-80) -->
            <div class="requests-list" id="requestsList" tabindex="-1">
                <div class="empty-state" id="emptyState">
                    <div class="empty-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="url(#tmIconGrad)" stroke-width="1.5">
                            <defs>
                                <linearGradient id="tmIconGrad" x1="0" y1="0" x2="1" y2="1">
                                    <stop offset="0%" stop-color="#1e63f5" />
                                    <stop offset="100%" stop-color="#0bbcd4" />
                                </linearGradient>
                            </defs>
                            <path d="M4 7V5a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v2" />
                            <path d="M3 7h18v12a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7Z" />
                            <path d="M9 12h6" />
                        </svg>
                    </div>
                    <div class="empty-title">No intercepted requests yet</div>
                    <div class="empty-description">
                        Trigger a request that matches one of your rules to see it here.
                    </div>
                </div>
                <div id="requestTable" role="table" aria-labelledby="logHeading">
                    <div class="request-item request-item-header" role="row">
                        <div class="request-method col-header" role="columnheader">Method</div>
                        <div class="request-url col-header" role="columnheader">URL</div>
                        <div class="rule-info col-header" role="columnheader">Rule</div>
                        <div class="request-status col-header" role="columnheader">Status</div>
                        <div class="timestamp col-header" role="columnheader">Time</div>
                        <div class="request-actions col-header" role="columnheader">
                            <span class="visually-hidden">Actions</span>
                        </div>
                    </div>
                    <div id="requestItems" role="rowgroup"></div>
                </div>
            </div>
        </section>
    </main>

    <script src="../src/common.js"></script>
    <script src="har.js"></script>
    <script src="panel-helpers.js"></script>
    <script src="panel.js"></script>
</body>
</html>
