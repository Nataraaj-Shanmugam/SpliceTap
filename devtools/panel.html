<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TurboMock Panel</title>
    <style>
        :root {
            --bg-app: #0f1420;
            --bg-card: #1a2130;
            --bg-elevated: #141b28;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --accent: #4f6ef7;
            --border: rgba(148, 163, 184, 0.14);
            --font-main: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            --font-mono: ui-monospace, 'SF Mono', 'Cascadia Code', Consolas, 'Liberation Mono', Menlo, monospace;
        }

        /* Light theme — mirrors popup/options' `theme-light` class + values
           (popup/popup.css:26-39). Applied by panel.js from the settings
           read off the existing `getRules` response (U-9); 'auto' resolves
           via prefers-color-scheme, same as popup.js/options.js. */
        body.theme-light {
            --bg-app: #ffffff;
            --bg-card: #f2f4f7;
            --bg-elevated: #e7ebf0;
            --text-main: #16202e;
            --text-muted: #5b6b7f;
            --accent: #3355e0;
            --border: rgba(15, 23, 42, 0.12);
        }

        body.theme-light .method-get { background: rgba(2, 132, 199, 0.12); color: #0369a1; }
        body.theme-light .method-post { background: rgba(21, 128, 61, 0.12); color: #15803d; }
        body.theme-light .method-put { background: rgba(217, 119, 6, 0.14); color: #b45309; }
        body.theme-light .method-delete { background: rgba(220, 38, 38, 0.12); color: #b91c1c; }

        body.theme-light .status-success { background: rgba(21, 128, 61, 0.12); color: #15803d; }
        body.theme-light .status-error { background: rgba(220, 38, 38, 0.12); color: #b91c1c; }
        body.theme-light .status-pending { background: rgba(15, 23, 42, 0.08); color: #5b6b7f; }

        body.theme-light .rule-type-badge[data-type="mock"] { background: rgba(51, 85, 224, 0.12); color: #2846c9; }
        body.theme-light .rule-type-badge[data-type="block"] { background: rgba(220, 38, 38, 0.12); color: #b91c1c; }
        body.theme-light .rule-type-badge[data-type="delay"] { background: rgba(217, 119, 6, 0.14); color: #b45309; }
        body.theme-light .rule-type-badge[data-type="redirect"] { background: rgba(2, 132, 199, 0.12); color: #0369a1; }
        body.theme-light .rule-type-badge[data-type="headers"] { background: rgba(21, 128, 61, 0.12); color: #15803d; }
        body.theme-light .rule-type-badge[data-type="queryparams"] { background: rgba(124, 58, 237, 0.12); color: #6d28d9; }

        body.theme-light .clear-btn { background: rgba(220, 38, 38, 0.08); color: #b91c1c; border-color: rgba(220, 38, 38, 0.22); }
        body.theme-light .clear-btn:hover { background: rgba(220, 38, 38, 0.14); }

        body.theme-light .pause-btn { background: rgba(15, 23, 42, 0.05); color: var(--text-main); border-color: rgba(15, 23, 42, 0.16); }
        body.theme-light .pause-btn:hover { background: rgba(15, 23, 42, 0.09); }

        body.theme-light .error-state { background: rgba(220, 38, 38, 0.06); border-color: rgba(220, 38, 38, 0.2); color: #b91c1c; }

        * { box-sizing: border-box; }

        body {
            font-family: var(--font-main);
            margin: 0;
            padding: 20px;
            background: var(--bg-app);
            color: var(--text-main);
        }

        .visually-hidden {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }

        .panel-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border);
        }

        .panel-logo {
            width: 30px;
            height: 30px;
            border-radius: 7px;
            background: var(--accent);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 12px;
            letter-spacing: -0.3px;
        }

        .panel-title {
            font-size: 18px;
            font-weight: 600;
            margin: 0;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
            gap: 12px;
            margin-bottom: 24px;
        }

        .stat-card {
            background: var(--bg-card);
            padding: 16px 18px;
            border-radius: 10px;
            border: 1px solid var(--border);
        }

        .stat-value {
            font-size: 24px;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 2px;
        }

        .stat-label {
            font-size: 13px;
            color: var(--text-muted);
            margin: 0;
        }

        .requests-section {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 10px;
            overflow: hidden;
        }

        .section-header {
            padding: 14px 18px;
            background: var(--bg-elevated);
            border-bottom: 1px solid var(--border);
            font-weight: 600;
            font-size: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
        }

        .section-header h2 {
            margin: 0;
            font: inherit;
        }

        .section-header-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .pause-btn {
            background: rgba(148, 163, 184, 0.12);
            color: var(--text-main);
            border: 1px solid var(--border);
            padding: 5px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.15s;
        }

        .pause-btn:hover {
            background: rgba(148, 163, 184, 0.2);
        }

        .clear-btn {
            background: rgba(239, 68, 68, 0.12);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.28);
            padding: 5px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.15s;
        }

        .clear-btn:hover {
            background: rgba(239, 68, 68, 0.2);
        }

        .filter-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 18px;
            background: var(--bg-card);
            border-bottom: 1px solid var(--border);
        }

        .filter-input {
            flex: 1;
            min-width: 0;
            background: var(--bg-app);
            color: var(--text-main);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 6px 10px;
            font-size: 12.5px;
            font-family: var(--font-main);
        }

        .filter-select {
            background: var(--bg-app);
            color: var(--text-main);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 6px 8px;
            font-size: 12.5px;
            font-family: var(--font-main);
        }

        .requests-list {
            max-height: 460px;
            overflow-y: auto;
        }

        .request-item {
            padding: 11px 18px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .request-item:last-child {
            border-bottom: none;
        }

        .request-item-header {
            position: sticky;
            top: 0;
            z-index: 1;
            background: var(--bg-elevated);
            padding-top: 8px;
            padding-bottom: 8px;
        }

        .col-header {
            background: transparent !important;
            color: var(--text-muted) !important;
            font-weight: 600;
            font-size: 10.5px;
            text-transform: uppercase;
            letter-spacing: 0.4px;
        }

        .request-method {
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            flex-shrink: 0;
            background: rgba(148, 163, 184, 0.16);
            color: var(--text-muted);
        }

        .method-get { background: rgba(56, 189, 248, 0.18); color: #7dd3fc; }
        .method-post { background: rgba(34, 197, 94, 0.18); color: #6ee7a0; }
        .method-put { background: rgba(251, 146, 60, 0.18); color: #fdba74; }
        .method-delete { background: rgba(244, 63, 94, 0.18); color: #fb7185; }

        .request-url {
            font-family: var(--font-mono);
            font-size: 12.5px;
            flex: 1;
            min-width: 0;
            color: var(--text-main);
        }

        .url-toggle {
            background: none;
            border: none;
            padding: 0;
            margin: 0;
            color: inherit;
            font: inherit;
            text-align: left;
            cursor: pointer;
            width: 100%;
            word-break: break-all;
        }

        .url-toggle:hover,
        .url-toggle:focus-visible {
            text-decoration: underline;
        }

        .request-status {
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
            flex-shrink: 0;
        }

        .status-success { background: rgba(34, 197, 94, 0.16); color: #6ee7a0; }
        .status-error { background: rgba(239, 68, 68, 0.16); color: #f87171; }
        .status-pending { background: rgba(148, 163, 184, 0.16); color: #94a3b8; }

        /* Hidden by default so there is no flash of an empty table before
           panel.js's first render decides whether to show it or the
           empty-state message. */
        #requestTable {
            display: none;
        }

        .rule-info {
            display: flex;
            flex-direction: column;
            gap: 3px;
            min-width: 140px;
            flex-shrink: 0;
            font-size: 12px;
        }

        .rule-name {
            font-weight: 600;
            color: var(--text-main);
        }

        .rule-type-badge {
            display: inline-block;
            width: fit-content;
            padding: 1px 7px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            background: rgba(148, 163, 184, 0.16);
            color: var(--text-muted);
        }

        .rule-type-badge[data-type="mock"] { background: rgba(79, 110, 247, 0.18); color: #8ea2ff; }
        .rule-type-badge[data-type="block"] { background: rgba(244, 63, 94, 0.18); color: #fb7185; }
        .rule-type-badge[data-type="delay"] { background: rgba(251, 146, 60, 0.18); color: #fdba74; }
        .rule-type-badge[data-type="redirect"] { background: rgba(56, 189, 248, 0.18); color: #7dd3fc; }
        .rule-type-badge[data-type="headers"] { background: rgba(34, 197, 94, 0.18); color: #6ee7a0; }
        .rule-type-badge[data-type="queryparams"] { background: rgba(167, 139, 250, 0.18); color: #c4b5fd; }

        .timestamp {
            font-size: 11px;
            color: var(--text-muted);
            flex-shrink: 0;
            min-width: 60px;
            text-align: right;
        }

        .request-actions {
            flex-shrink: 0;
        }

        .dismiss-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 14px;
            line-height: 1;
            padding: 4px 6px;
            border-radius: 4px;
        }

        .dismiss-btn:hover,
        .dismiss-btn:focus-visible {
            background: rgba(148, 163, 184, 0.16);
            color: var(--text-main);
        }

        .empty-state {
            padding: 56px 20px;
            text-align: center;
            color: var(--text-muted);
        }

        .empty-icon {
            width: 40px;
            height: 40px;
            margin: 0 auto 16px;
            opacity: 0.55;
        }

        .empty-icon svg {
            width: 100%;
            height: 100%;
        }

        .empty-title {
            font-size: 15px;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 6px;
        }

        .empty-description {
            font-size: 13px;
            line-height: 1.5;
        }

        .error-state {
            padding: 12px 16px;
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.24);
            border-radius: 8px;
            color: #f87171;
            font-size: 13px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <header class="panel-header">
        <div class="panel-logo">TM</div>
        <h1 class="panel-title">TurboMock</h1>
    </header>

    <main>
        <div id="errorContainer"></div>

        <!-- Announces new entries / clear actions politely, without forcing
             a screen reader through the whole (possibly 200-row) log on
             every poll tick (A-10). Visually hidden, kept in the DOM. -->
        <div id="logAnnouncer" class="visually-hidden" role="status" aria-live="polite"></div>

        <section class="stats-grid" aria-labelledby="statsHeading">
            <h2 id="statsHeading" class="visually-hidden">Statistics</h2>
            <div class="stat-card">
                <div class="stat-value" id="totalRequests">0</div>
                <div class="stat-label">Logged (this buffer)</div>
            </div>

            <div class="stat-card">
                <div class="stat-value" id="mockedRequests">0</div>
                <div class="stat-label">Intercepted (all time)</div>
            </div>

            <div class="stat-card">
                <div class="stat-value" id="activeRules">0</div>
                <div class="stat-label">Active Rules</div>
            </div>

            <div class="stat-card">
                <div class="stat-value" id="successRate">0%</div>
                <div class="stat-label">2xx Responses</div>
            </div>
        </section>

        <section class="requests-section" aria-labelledby="logHeading">
            <div class="section-header">
                <h2 id="logHeading">Intercepted Requests</h2>
                <div class="section-header-actions">
                    <button type="button" class="pause-btn" id="pauseBtn" aria-pressed="false">Pause</button>
                    <button type="button" class="clear-btn" id="clearRequestsBtn">Clear</button>
                </div>
            </div>

            <div class="filter-bar">
                <input type="text" class="filter-input" id="filterText" placeholder="Filter by URL or rule name…" aria-label="Filter requests by URL or rule name">
                <select class="filter-select" id="filterType" aria-label="Filter by rule type">
                    <option value="all">All types</option>
                    <option value="mock">Mock</option>
                    <option value="block">Block</option>
                    <option value="delay">Delay</option>
                    <option value="redirect">Redirect</option>
                    <option value="headers">Headers</option>
                    <option value="queryparams">Query params</option>
                </select>
            </div>

            <div class="requests-list" id="requestsList">
                <div class="empty-state" id="emptyState">
                    <div class="empty-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                            <path d="M4 7V5a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v2" />
                            <path d="M3 7h18v12a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7Z" />
                            <path d="M9 12h6" />
                        </svg>
                    </div>
                    <div class="empty-title">No intercepted requests yet</div>
                    <div class="empty-description">
                        Trigger a request that matches one of your rules to see it here.
                    </div>
                </div>
                <div id="requestTable" role="table" aria-labelledby="logHeading">
                    <div class="request-item request-item-header" role="row">
                        <div class="request-method col-header" role="columnheader">Method</div>
                        <div class="request-url col-header" role="columnheader">URL</div>
                        <div class="rule-info col-header" role="columnheader">Rule</div>
                        <div class="request-status col-header" role="columnheader">Status</div>
                        <div class="timestamp col-header" role="columnheader">Time</div>
                        <div class="request-actions col-header" role="columnheader">
                            <span class="visually-hidden">Actions</span>
                        </div>
                    </div>
                    <div id="requestItems" role="rowgroup"></div>
                </div>
            </div>
        </section>
    </main>

    <script src="panel.js"></script>
</body>
</html>
